[package]
name = "appmanager"
version = "0.1.0"
description = "A Windows software manager desktop app."
authors = ["AppManager"]
edition = "2021"

[lib]
name = "appmanager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pinyin = "0.11"
zip = { version = "2", default-features = false, features = ["deflate"] }
